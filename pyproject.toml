[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "kartzero"
version = "0.1.0"
requires-python = "==3.12.*"

[tool.setuptools]
packages = ["kartzero"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["kartzero", "scripts", "tests"]
disallow_untyped_defs = true
check_untyped_defs = true
mypy_path = "tests"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "desmume.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["test_kart", "test_observation", "test_reward", "test_sensors", "test_track", "test_training", "test_learner", "test_environment", "test_versions", "test_test_lap", "test_runs", "test_archive", "test_self_imitation", "test_holds", "test_curiosity"]
disallow_untyped_defs = false
check_untyped_defs = false

